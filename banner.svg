<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="log4k — logging and tracing for Kotlin Multiplatform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A3D"/>
      <stop offset="1" stop-color="#232659"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2E3270" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect x="0" y="0" width="8" height="320" fill="#A99BFF"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="84" y="168" font-size="104" font-weight="700" fill="#E6E8FA" letter-spacing="-3">log4k<tspan fill="#A99BFF">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="88" y="230" font-size="20" fill="#A9AEDB">Logging and tracing for Kotlin Multiplatform</text>

    <!-- log output card -->
    <g transform="translate(772 64)">
      <rect width="428" height="192" rx="12" fill="#12152F" stroke="#3A3F86"/>
      <text x="24" y="38" font-size="14" fill="#A99BFF">trace.span(<tspan fill="#B9B3FF">"checkout"</tspan>) { <tspan fill="#7479B0">log.info { … }</tspan> }</text>
      <line x1="24" y1="56" x2="404" y2="56" stroke="#3A3F86"/>
      <text x="24" y="82" font-size="15" fill="#7479B0">level</text>
      <text x="96" y="82" font-size="15" fill="#7479B0">message</text>
      <text x="404" y="82" font-size="15" fill="#7479B0" text-anchor="end">span</text>
      <line x1="24" y1="94" x2="404" y2="94" stroke="#2A2E66" stroke-dasharray="3 4"/>
      <text x="24" y="120" font-size="16" fill="#7CD4B4">INFO</text>
      <text x="96" y="120" font-size="16" fill="#E6E8FA">order placed</text>
      <text x="404" y="120" font-size="16" fill="#7479B0" text-anchor="end">4f2a</text>
      <text x="24" y="146" font-size="16" fill="#8FA3FF">DEBUG</text>
      <text x="96" y="146" font-size="16" fill="#E6E8FA">cache hit</text>
      <text x="404" y="146" font-size="16" fill="#7479B0" text-anchor="end">4f2a</text>
      <text x="24" y="172" font-size="16" fill="#F2A65A">WARN</text>
      <text x="96" y="172" font-size="16" fill="#E6E8FA">retrying payment</text>
      <text x="404" y="172" font-size="16" fill="#7479B0" text-anchor="end">91c0</text>
    </g>
    <text x="1200" y="284" font-size="14" fill="#5D629C" text-anchor="end">(OpenTelemetry-compatible spans)</text>
  </g>
</svg>
